<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Kite System</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#eef6fb" />
  <link rel="preload" href="fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/sour-gummy-500.woff2" as="font" type="font/woff2" crossorigin />
  
  <!-- CSS Design System -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  
  <!-- Supabase JS Client & Lucide Icons -->
  <script src="env.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/lucide.min.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <!-- Brand Header -->
    <div class="auth-brand">
      <img src="assets/logo-vertical-dark.png" srcset="assets/logo-vertical-dark.png 1x, assets/logo-vertical@2x-dark.png 2x" alt="Kite Design Studio" width="112" height="121" />
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to Kite System</p>
    </div>

    <!-- Error Alert Banner -->
    <div id="authAlert" class="alert alert-error hidden">
      <span id="authAlertText"></span>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label for="emailInput" class="form-label">Company Email</label>
        <input 
          id="emailInput" 
          type="email" 
          required 
          autocomplete="email" 
          placeholder="name@kiteagency-eg.com" 
          class="form-control" 
        />
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-1-5);">
          <label for="passwordInput" class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="forgot-password.html" class="text-2xs text-primary" style="font-weight: 500;">Forgot password?</a>
        </div>
        <div style="position: relative;">
          <input 
            id="passwordInput" 
            type="password" 
            required 
            autocomplete="current-password" 
            placeholder="••••••••••••" 
            class="form-control" 
            style="padding-right: 40px;"
          />
          <button 
            type="button" 
            id="togglePasswordBtn" 
            aria-label="Toggle password visibility"
            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); padding: 4px;"
          >
            <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5);">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMeCheck" checked />
          <span class="text-xs text-muted">Keep me signed in</span>
        </label>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; height: 42px;">
        <span id="btnText">Sign In to Workspace</span>
        <span id="btnSpinner" class="hidden animate-spin">⟳</span>
      </button>
    </form>

    <!-- Footer Security Notice -->
    <div class="auth-footnote">
      <p class="text-2xs text-dim">
        Single sign-on protected by Supabase Auth with Row Level Security.
        <br>
        Only authorized agency personnel may enter.
      </p>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Auth Script -->
  <script type="module" src="js/auth/login.js"></script>
  <script src="js/ui-init.js"></script>
</body>
</html>
