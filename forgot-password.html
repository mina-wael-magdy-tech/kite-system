<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — PULSE STUDIO OS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  
  <script src="env.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/lucide.min.js"></script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-4);
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.12), transparent 40%),
                  var(--studio-950);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: var(--space-8);
      background: rgba(23, 26, 38, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: var(--space-6);">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: var(--radius-xl); background: var(--studio-850); border: 1px solid var(--border-medium); margin-bottom: var(--space-3); color: var(--color-primary-light);">
        <i data-lucide="key-round" style="width: 22px; height: 22px;"></i>
      </div>
      <h1 class="font-display font-bold text-lg text-white">Reset Account Password</h1>
      <p class="text-xs text-muted" style="margin-top: 4px;">Enter your email to receive a secure recovery link.</p>
    </div>

    <div id="alertBox" class="hidden" style="margin-bottom: var(--space-4); padding: var(--space-3); border-radius: var(--radius-lg); font-size: var(--text-xs);">
      <span id="alertText"></span>
    </div>

    <form id="forgotForm">
      <div class="form-group">
        <label for="emailInput" class="form-label">Registered Company Email</label>
        <input 
          id="emailInput" 
          type="email" 
          required 
          autocomplete="email" 
          placeholder="name@pulsestudio.agency" 
          class="form-control" 
        />
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; height: 42px; margin-top: var(--space-2);">
        <span id="btnText">Send Recovery Link</span>
        <span id="btnSpinner" class="hidden animate-spin">⟳</span>
      </button>

      <div style="text-align: center; margin-top: var(--space-5);">
        <a href="login.html" class="text-xs text-muted" style="display: inline-flex; align-items: center; gap: 4px;">
          ← Back to Sign In
        </a>
      </div>
    </form>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="js/auth/forgot-password.js"></script>
  <script src="js/ui-init.js"></script>
</body>
</html>
