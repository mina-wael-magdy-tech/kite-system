<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Kite System</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#eef6fb" />
  <link rel="preload" href="fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/sour-gummy-500.woff2" as="font" type="font/woff2" crossorigin />
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  
  <script src="env.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/lucide.min.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <img src="assets/logo-vertical-dark.png" srcset="assets/logo-vertical-dark.png 1x, assets/logo-vertical@2x-dark.png 2x" alt="Kite Design Studio" width="112" height="121" />
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-sub">Enter your email to receive a secure recovery link.</p>
    </div>

    <div id="alertBox" class="alert hidden">
      <span id="alertText"></span>
    </div>

    <form id="forgotForm">
      <div class="form-group">
        <label for="emailInput" class="form-label">Registered Company Email</label>
        <input 
          id="emailInput" 
          type="email" 
          required 
          autocomplete="email" 
          placeholder="name@kiteagency-eg.com" 
          class="form-control" 
        />
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; height: 42px; margin-top: var(--space-2);">
        <span id="btnText">Send Recovery Link</span>
        <span id="btnSpinner" class="hidden animate-spin">⟳</span>
      </button>

      <div style="text-align: center; margin-top: var(--space-5);">
        <a href="login.html" class="text-xs text-muted" style="display: inline-flex; align-items: center; gap: 4px;">
          ← Back to Sign In
        </a>
      </div>
    </form>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="js/auth/forgot-password.js"></script>
  <script src="js/ui-init.js"></script>
</body>
</html>
