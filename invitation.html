<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accept Invitation — Kite System</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0b0d" />
  <link rel="preload" href="fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/sour-gummy-500.woff2" as="font" type="font/woff2" crossorigin />
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  
  <script src="env.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/lucide.min.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <img src="assets/logo-vertical.png" srcset="assets/logo-vertical.png 1x, assets/logo-vertical@2x.png 2x" alt="Kite Design Studio" width="112" height="121" />
      <h1 class="auth-title">Join Kite System</h1>
      <p class="auth-sub">Set up your password to activate your Kite account.</p>
    </div>

    <div id="inviteInfoCard" class="card" style="padding: var(--space-4); margin-bottom: var(--space-5); background: var(--studio-900);">
      <div style="display: flex; align-items: center; gap: var(--space-3);">
        <div class="avatar avatar-md" id="inviteAvatar">PS</div>
        <div>
          <div class="font-semibold text-sm text-white" id="inviteName">Invited Team Member</div>
          <div class="text-2xs text-muted" id="inviteDeptRole">Studio Specialist</div>
        </div>
      </div>
    </div>

    <div id="alertBox" class="alert hidden">
      <span id="alertText"></span>
    </div>

    <form id="inviteForm">
      <div class="form-group">
        <label for="passwordInput" class="form-label">Create Your Password</label>
        <input 
          id="passwordInput" 
          type="password" 
          required 
          autocomplete="new-password" 
          placeholder="Min. 8 chars, 1 uppercase, 1 number" 
          class="form-control" 
        />
      </div>

      <div class="form-group">
        <label for="confirmInput" class="form-label">Confirm Password</label>
        <input 
          id="confirmInput" 
          type="password" 
          required 
          autocomplete="new-password" 
          placeholder="Repeat password" 
          class="form-control" 
        />
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; height: 44px; margin-top: var(--space-3);">
        <span id="btnText">Activate Account & Enter Studio</span>
        <span id="btnSpinner" class="hidden animate-spin">⟳</span>
      </button>
    </form>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="js/auth/invitation.js"></script>
  <script src="js/ui-init.js"></script>
</body>
</html>
