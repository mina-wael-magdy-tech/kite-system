<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accept Invitation — PULSE STUDIO OS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  
  <script src="env.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/lucide.min.js"></script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-4);
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.12), transparent 40%),
                  var(--studio-950);
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      padding: var(--space-8);
      background: rgba(23, 26, 38, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: var(--space-6);">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: var(--radius-xl); background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%); margin-bottom: var(--space-3); color: #ffffff; box-shadow: 0 6px 18px rgba(16, 185, 129, 0.3);">
        <i data-lucide="user-plus" style="width: 24px; height: 24px;"></i>
      </div>
      <h1 class="font-display font-bold text-xl text-white">Join PULSE STUDIO OS</h1>
      <p class="text-xs text-muted" style="margin-top: 4px;">Set up your password to activate your agency account.</p>
    </div>

    <div id="inviteInfoCard" class="card" style="padding: var(--space-4); margin-bottom: var(--space-5); background: var(--studio-900);">
      <div style="display: flex; align-items: center; gap: var(--space-3);">
        <div class="avatar avatar-md" id="inviteAvatar">PS</div>
        <div>
          <div class="font-semibold text-sm text-white" id="inviteName">Invited Team Member</div>
          <div class="text-2xs text-muted" id="inviteDeptRole">Studio Specialist</div>
        </div>
      </div>
    </div>

    <div id="alertBox" class="hidden" style="margin-bottom: var(--space-4); padding: var(--space-3); border-radius: var(--radius-lg); font-size: var(--text-xs);">
      <span id="alertText"></span>
    </div>

    <form id="inviteForm">
      <div class="form-group">
        <label for="passwordInput" class="form-label">Create Your Password</label>
        <input 
          id="passwordInput" 
          type="password" 
          required 
          autocomplete="new-password" 
          placeholder="Min. 8 chars, 1 uppercase, 1 number" 
          class="form-control" 
        />
      </div>

      <div class="form-group">
        <label for="confirmInput" class="form-label">Confirm Password</label>
        <input 
          id="confirmInput" 
          type="password" 
          required 
          autocomplete="new-password" 
          placeholder="Repeat password" 
          class="form-control" 
        />
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; height: 44px; margin-top: var(--space-3);">
        <span id="btnText">Activate Account & Enter Studio</span>
        <span id="btnSpinner" class="hidden animate-spin">⟳</span>
      </button>
    </form>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="js/auth/invitation.js"></script>
  <script src="js/ui-init.js"></script>
</body>
</html>
