<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Set New Password — Kite System</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#eef6fb" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Kite" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preload" href="fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/sour-gummy-500.woff2" as="font" type="font/woff2" crossorigin />
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  
  <script src="env.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/lucide.min.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <img src="assets/logo-vertical-dark.png" srcset="assets/logo-vertical-dark.png 1x, assets/logo-vertical@2x-dark.png 2x" alt="Kite Design Studio" width="112" height="121" />
      <h1 class="auth-title">Create a new password</h1>
      <p class="auth-sub">Choose a strong password for your account.</p>
    </div>

    <div id="alertBox" class="alert hidden">
      <span id="alertText"></span>
    </div>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPasswordInput" class="form-label">New Password</label>
        <input 
          id="newPasswordInput" 
          type="password" 
          required 
          autocomplete="new-password" 
          placeholder="Min. 8 chars, 1 uppercase, 1 number" 
          class="form-control" 
        />
      </div>

      <div class="form-group">
        <label for="confirmPasswordInput" class="form-label">Confirm New Password</label>
        <input 
          id="confirmPasswordInput" 
          type="password" 
          required 
          autocomplete="new-password" 
          placeholder="Repeat password" 
          class="form-control" 
        />
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; height: 42px; margin-top: var(--space-3);">
        <span id="btnText">Save & Sign In</span>
        <span id="btnSpinner" class="hidden animate-spin">⟳</span>
      </button>

      <div style="text-align: center; margin-top: var(--space-5);">
        <a href="login.html" class="text-xs text-muted">← Back to Sign In</a>
      </div>
    </form>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="js/auth/reset-password.js"></script>
  <script src="js/ui-init.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
